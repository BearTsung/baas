server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trading
    username: trading
    password: trading123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

jwt:
  # 不提供預設值：未設定 JWT_SECRET 時啟動失敗，避免以公開的金鑰簽發 token
  secret: ${JWT_SECRET}
  expiration-ms: 3600000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
